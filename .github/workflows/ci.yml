name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://example.invalid
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lodge
          POSTGRES_PASSWORD: lodge
          POSTGRES_DB: lodge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lodge" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lodge:lodge@localhost:5432/lodge_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lodge
          POSTGRES_PASSWORD: lodge
          POSTGRES_DB: lodge_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lodge" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Public site (booking engine off)
        run: pnpm test:e2e
      - name: Prepare local database with placeholder data
        env:
          DATABASE_URL: postgres://lodge:lodge@localhost:5432/lodge_e2e
        run: pnpm db:migrate && pnpm db:seed:dev
      - name: Booking flow and admin (preview configuration)
        env:
          DATABASE_URL: postgres://lodge:lodge@localhost:5432/lodge_e2e
          E2E_BOOKING: "true"
          BOOKING_PREVIEW: "true"
          ADMIN_AUTH_MODE: local
          ADMIN_EMAILS: owner@example.test
        run: |
          # Throwaway credentials for this CI run only.
          export ADMIN_LOCAL_PASSWORD="$(openssl rand -hex 16)"
          export ADMIN_SESSION_SECRET="$(openssl rand -hex 32)"
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
